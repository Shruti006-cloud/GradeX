version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - '8000:8000'
    volumes:
      - './backend/uploads:/app/uploads'
    env_file: ./backend/.env
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - './frontend:/app'
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - '5173:5173'
    depends_on:
      - backend
